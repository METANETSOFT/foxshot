[package]
name = "foxshot-platform-windows"
version = "0.3.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# Normal (ungated) dependency: the library body is cfg-gated to Windows, so on
# every other OS this crate compiles to nothing and foxshot-core sits unused
# but harmless.
foxshot-core = { path = "../foxshot-core" }

# The HTTP stack exists only where the adapter runs.
[target.'cfg(target_os = "windows")'.dependencies]
# ureq 3.x is rustls-only (ring + webpki roots): no OpenSSL, no system TLS.
ureq = { version = "3", default-features = false, features = ["rustls"] }
