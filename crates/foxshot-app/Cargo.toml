[package]
name = "foxshot-app"
version = "0.2.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "foxshot"
path = "src/main.rs"

[dependencies]
foxshot-core = { path = "../foxshot-core" }
png = "0.17"

[target.'cfg(target_os = "linux")'.dependencies]
foxshot-platform-linux = { path = "../foxshot-platform-linux" }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
foxshot-platform-macos = { path = "../foxshot-platform-macos" }
