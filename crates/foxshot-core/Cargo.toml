[package]
name = "foxshot-core"
version = "0.2.0"
description = "FoxShot Core — platform-agnostic behaviour: capture pipeline, annotation model, upload, library, module registry."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# Dependencies are added only when actually needed:
#   serde + serde_json — update-manifest parsing (S8); also the future home of
#                        settings + library persistence
#   sha2 + hmac       — AWS SigV4 request signing for uploads (S6); pure
#                        computation, Core still performs no I/O
# Still deliberately avoided here:
#   wgpu       — the render layer (lives in the UI crate, never in Core)
#   thiserror  — only if Error grows past hand-writing
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
